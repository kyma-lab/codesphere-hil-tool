# Define the entry points
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# Enable Docker as the provider
providers:
  docker:
    exposedByDefault: false

# Enable the Traefik dashboard
api:
  dashboard: false
  insecure: true

metrics:
  prometheus:
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0
    addEntryPointsLabels: true
    addServicesLabels: true
    manualRouting: false