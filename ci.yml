schemaVersion: v0.2

# HIL-Tool (gitlab.opencode.de/opendva/hil-tool) auf Codesphere
# 7 Services in einem Workspace.
#
# Pre-built application images aus ghcr.io/kyma-lab/* (public):
#   - server (Flask + gunicorn auf 8070, Code im Image)
#   - prediction-worker (Python ML-Inference)
#   - training-worker (Python ML-Training)
#   - svelte-app (SvelteKit auf 3000, Build im Image)
# Drittanbieter-Images für stateful services:
#   - mongo:7, rabbitmq:3-management-alpine, elasticsearch:8.13.4
#
# Dev-Domain-Routing per network.paths:
#   /api -> server
#   /    -> frontend (svelte-app)
# Interne Services ohne network-Block (Service-DNS reicht).
#
# Volumes:
#   - mongo-data, rabbitmq-data, elastic-data → Persistenz im Workspace-FS
#   - backend/shared → in server + workers gemountet (für ML-Modelle aus prepare)

prepare:
  steps:
    - name: Download BiLSTM-CRF model from Zenodo
      command: |
        set -euo pipefail
        MODELS_DIR=backend/shared/base-models
        mkdir -p "$MODELS_DIR"
        if [ -f "$MODELS_DIR/bilstm-crf/final-model.pt" ]; then
          echo "BiLSTM-CRF model already present, skipping."
          exit 0
        fi
        echo "Downloading bilstm_crf_trained.zip from Zenodo (DOI 10.5281/zenodo.14213139, ~2.7 GB)..."
        cd "$MODELS_DIR"
        curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
          -o bilstm_crf_trained.zip \
          "https://zenodo.org/records/14213139/files/bilstm_crf_trained.zip" || {
          echo "WARN: Zenodo download failed after retries — model must be populated manually under $MODELS_DIR/bilstm-crf/" >&2
          exit 0
        }
        echo "Unzipping..."
        unzip -o -q bilstm_crf_trained.zip
        rm -f bilstm_crf_trained.zip
        MODEL_DIR=$(find . -maxdepth 3 -name "final-model.pt" -exec dirname {} \; | head -1)
        if [ -z "$MODEL_DIR" ]; then
          echo "ERROR: final-model.pt not found after extraction" >&2
          exit 1
        fi
        if [ "$MODEL_DIR" != "./bilstm-crf" ]; then
          rm -rf bilstm-crf
          mv "$MODEL_DIR" bilstm-crf
        fi
        echo "BiLSTM-CRF model placed at $MODELS_DIR/bilstm-crf/"
        ls -la bilstm-crf/ | head -10

test:
  steps: []

run:
  mongodb:
    image: mongo:7
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:28017
    volumeMounts:
      - name: _workspace
        mountPath: /data/db
        workspacePath: mongo-data
    env:
      MONGO_INITDB_DATABASE: hil_prototype
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${{ vault.MONGO_PWD }}
    steps:
      - name: Start mongod with HTTP health sidecar
        command: |
          set -e
          apt-get update -qq
          apt-get install -y --no-install-recommends socat
          ( socat TCP-LISTEN:28017,fork,reuseaddr SYSTEM:'\
            if exec 3<>/dev/tcp/127.0.0.1/27017 2>/dev/null; then exec 3<&-; \
              printf "HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok"; \
            else \
              printf "HTTP/1.1 503 NotReady\r\nContent-Length: 8\r\n\r\nnotready"; \
            fi' ) &
          exec docker-entrypoint.sh mongod --bind_ip_all

  rabbitmq:
    image: rabbitmq:3-management-alpine
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:15672
    volumeMounts:
      - name: _workspace
        mountPath: /var/lib/rabbitmq
        workspacePath: rabbitmq-data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:9200/_cluster/health
    volumeMounts:
      - name: _workspace
        mountPath: /usr/share/elasticsearch/data
        workspacePath: elastic-data
    env:
      ES_DISCOVERY_TYPE: single-node
      ES_XPACK_SECURITY_ENABLED: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    steps:
      - name: Translate ES_* env to elasticsearch config
        command: |
          export discovery.type="$ES_DISCOVERY_TYPE"
          export xpack.security.enabled="$ES_XPACK_SECURITY_ENABLED"
          exec /usr/local/bin/docker-entrypoint.sh elasticsearch

  server:
    image: ghcr.io/kyma-lab/server:latest
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:8070/api/health
    network:
      ports:
        - port: 8070
          isPublic: true
      paths:
        - port: 8070
          path: /api
    # Mount only shared/ so the ML model from prepare lands inside the container.
    # Code lives in /app/ inside the image and stays untouched.
    volumeMounts:
      - name: _workspace
        mountPath: /app/shared
        workspacePath: backend/shared
    env:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_USER: root
      MONGO_PWD: ${{ vault.MONGO_PWD }}
      RABBITMQ_HOST: rabbitmq
      ELASTIC_HOST: http://elasticsearch:9200
      JWT_SECRET: ${{ vault.JWT_SECRET }}
      ADMIN_USER: ${{ vault.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ vault.ADMIN_PASSWORD }}
      ALLOW_CORS: "True"
      DISABLE_TRAINING: "True"
      TESTING: "False"
      BASE_MODELS_PATH: /app/shared/base-models
      USER_DATA_PATH: /app/shared
      BASE_TMP_PATH: /app/shared/tmp
    # No steps: image's CMD (cron && gunicorn ... server:app) runs.

  prediction-worker:
    image: ghcr.io/kyma-lab/prediction-worker:latest
    plan: 401
    replicas: 1
    healthEndpoint: http://localhost:8080
    volumeMounts:
      - name: _workspace
        mountPath: /app/shared
        workspacePath: backend/shared
    env:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_USER: root
      MONGO_PWD: ${{ vault.MONGO_PWD }}
      RABBITMQ_HOST: rabbitmq
      ELASTIC_HOST: http://elasticsearch:9200
      BASE_MODELS_PATH: /app/shared/base-models
      USER_DATA_PATH: /app/shared
      BASE_TMP_PATH: /app/shared/tmp
    steps:
      - name: Start prediction worker with HTTP health sidecar
        command: |
          mkdir -p /tmp/health && echo ok > /tmp/health/index.html
          ( cd /tmp/health && python -m http.server 8080 >/dev/null 2>&1 ) &
          cd /app
          exec python worker_predict.py

  training-worker:
    image: ghcr.io/kyma-lab/training-worker:latest
    plan: 401
    replicas: 1
    healthEndpoint: http://localhost:8080
    volumeMounts:
      - name: _workspace
        mountPath: /app/shared
        workspacePath: backend/shared
    env:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_USER: root
      MONGO_PWD: ${{ vault.MONGO_PWD }}
      RABBITMQ_HOST: rabbitmq
      DISABLE_TRAINING: "True"
      BASE_MODELS_PATH: /app/shared/base-models
      USER_DATA_PATH: /app/shared
    steps:
      - name: Start training worker with HTTP health sidecar
        command: |
          mkdir -p /tmp/health && echo ok > /tmp/health/index.html
          ( cd /tmp/health && python -m http.server 8080 >/dev/null 2>&1 ) &
          cd /app
          exec python worker_train.py

  frontend:
    image: ghcr.io/kyma-lab/svelte-app:latest
    plan: 101
    replicas: 1
    healthEndpoint: http://localhost:3000/
    network:
      ports:
        - port: 3000
          isPublic: true
      paths:
        - port: 3000
          path: /
    env:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: "https://${{ workspace.id }}-3000.1.csa.codesphere-demo.com"
    # No steps: image's CMD (node build/index.js) runs.
    # NB: VITE_SERVER_HOST_LOCATION was baked at build time. If the frontend
    # cannot reach /api, the build needs to be redone with VITE_SERVER_HOST_LOCATION=""
    # (so apiUrl is relative and goes through Codesphere routing to /api).
