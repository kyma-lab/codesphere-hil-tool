schemaVersion: v0.2

# HIL-Tool (gitlab.opencode.de/opendva/hil-tool) auf Codesphere
# 7 Services in einem Workspace: mongodb, rabbitmq, elasticsearch,
# server, prediction-worker, training-worker, frontend
#
# Dev-Domain-Routing per network.paths:
#   /api -> server
#   /    -> frontend
# Interne Services (mongo, rabbit, elastic) haben keinen network-Block
# (Mealie-WS-160-Muster: nur public Services listen network.ports).

prepare:
  steps:
    - name: Download BiLSTM-CRF model from Zenodo
      command: |
        set -euo pipefail
        MODELS_DIR=backend/shared/base-models
        mkdir -p "$MODELS_DIR"
        if [ -f "$MODELS_DIR/bilstm-crf/final-model.pt" ]; then
          echo "BiLSTM-CRF model already present, skipping."
          exit 0
        fi
        echo "Downloading bilstm_crf_trained.zip from Zenodo (DOI 10.5281/zenodo.14213139, ~2.7 GB)..."
        cd "$MODELS_DIR"
        curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
          -o bilstm_crf_trained.zip \
          "https://zenodo.org/records/14213139/files/bilstm_crf_trained.zip" || {
          echo "WARN: Zenodo download failed after retries — model must be populated manually under $MODELS_DIR/bilstm-crf/" >&2
          exit 0
        }
        echo "Unzipping..."
        unzip -o -q bilstm_crf_trained.zip
        rm -f bilstm_crf_trained.zip
        # zip may extract to a different folder name; locate final-model.pt and normalise to bilstm-crf/
        MODEL_DIR=$(find . -maxdepth 3 -name "final-model.pt" -exec dirname {} \; | head -1)
        if [ -z "$MODEL_DIR" ]; then
          echo "ERROR: final-model.pt not found after extraction" >&2
          exit 1
        fi
        if [ "$MODEL_DIR" != "./bilstm-crf" ]; then
          rm -rf bilstm-crf
          mv "$MODEL_DIR" bilstm-crf
        fi
        echo "BiLSTM-CRF model placed at $MODELS_DIR/bilstm-crf/"
        ls -la bilstm-crf/ | head -10

test:
  steps: []

run:
  mongodb:
    image: mongo:7
    plan: 301
    replicas: 1
    volumeMounts:
      - name: _workspace
        mountPath: /data/db
        workspacePath: mongo-data
    env:
      MONGO_INITDB_DATABASE: hil_prototype
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${{ vault.MONGO_PWD }}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:15672
    volumeMounts:
      - name: _workspace
        mountPath: /var/lib/rabbitmq
        workspacePath: rabbitmq-data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:9200/_cluster/health
    volumeMounts:
      - name: _workspace
        mountPath: /usr/share/elasticsearch/data
        workspacePath: elastic-data
    env:
      ES_DISCOVERY_TYPE: single-node
      ES_XPACK_SECURITY_ENABLED: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    steps:
      - name: Translate ES_* env to elasticsearch config
        command: |
          export discovery.type="$ES_DISCOVERY_TYPE"
          export xpack.security.enabled="$ES_XPACK_SECURITY_ENABLED"
          exec /usr/local/bin/docker-entrypoint.sh elasticsearch

  server:
    image: python:3.8
    plan: 301
    replicas: 1
    healthEndpoint: http://localhost:8070/api/health
    network:
      ports:
        - port: 8070
          isPublic: true
      paths:
        - port: 8070
          path: /api
    volumeMounts:
      - name: _workspace
        mountPath: /app
        workspacePath: .
    env:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_USER: root
      MONGO_PWD: ${{ vault.MONGO_PWD }}
      RABBITMQ_HOST: rabbitmq
      ELASTIC_HOST: http://elasticsearch:9200
      JWT_SECRET: ${{ vault.JWT_SECRET }}
      ADMIN_USER: ${{ vault.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ vault.ADMIN_PASSWORD }}
      ALLOW_CORS: "True"
      DISABLE_TRAINING: "True"
      TESTING: "False"
      BASE_MODELS_PATH: /app/backend/shared/base-models
      USER_DATA_PATH: /app/backend/shared
      BASE_TMP_PATH: /app/backend/shared/tmp
    steps:
      - name: Install system deps and python packages
        command: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends tesseract-ocr-deu poppler-utils
          cd /app/backend/server-container
          pip install --no-cache-dir -r requirements_base.txt
          pip install --no-cache-dir -r requirements_server.txt
          pip install --no-cache-dir gunicorn
      - name: Start gunicorn
        command: |
          cd /app/backend/server-container
          PYTHONPATH=/app/backend:/app/backend/server-container gunicorn --workers 4 --threads 2 -b 0.0.0.0:8070 server:app

  prediction-worker:
    image: python:3.8
    plan: 401
    replicas: 1
    volumeMounts:
      - name: _workspace
        mountPath: /app
        workspacePath: .
    env:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_USER: root
      MONGO_PWD: ${{ vault.MONGO_PWD }}
      RABBITMQ_HOST: rabbitmq
      ELASTIC_HOST: http://elasticsearch:9200
      BASE_MODELS_PATH: /app/backend/shared/base-models
      USER_DATA_PATH: /app/backend/shared
      BASE_TMP_PATH: /app/backend/shared/tmp
    steps:
      - name: Install python packages
        command: |
          set -euo pipefail
          cd /app/backend/worker-predict-container
          pip install --no-cache-dir -r requirements_base.txt
          pip install --no-cache-dir -r requirements_worker.txt
          python -m spacy download de_core_news_sm
      - name: Start prediction worker
        command: |
          cd /app/backend/worker-predict-container
          PYTHONPATH=/app/backend:/app/backend/worker-predict-container python worker_predict.py

  training-worker:
    image: python:3.8
    plan: 401
    replicas: 1
    volumeMounts:
      - name: _workspace
        mountPath: /app
        workspacePath: .
    env:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_USER: root
      MONGO_PWD: ${{ vault.MONGO_PWD }}
      RABBITMQ_HOST: rabbitmq
      DISABLE_TRAINING: "True"
      BASE_MODELS_PATH: /app/backend/shared/base-models
      USER_DATA_PATH: /app/backend/shared
    steps:
      - name: Install python packages
        command: |
          set -euo pipefail
          cd /app/backend/worker-train-container
          pip install --no-cache-dir -r requirements_base.txt
          pip install --no-cache-dir -r requirements_worker.txt
      - name: Start training worker
        command: |
          cd /app/backend/worker-train-container
          PYTHONPATH=/app/backend:/app/backend/worker-train-container python worker_train.py

  frontend:
    image: node:20
    plan: 101
    replicas: 1
    healthEndpoint: http://localhost:3000/
    network:
      ports:
        - port: 3000
          isPublic: true
      paths:
        - port: 3000
          path: /
    volumeMounts:
      - name: _workspace
        mountPath: /app
        workspacePath: .
    env:
      VITE_SERVER_HOST_LOCATION: ""
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: "https://${{ workspace.id }}-3000.1.csa.codesphere-demo.com"
    steps:
      - name: Install and build
        command: |
          set -euo pipefail
          cd /app/frontend
          npm ci
          VITE_SERVER_HOST_LOCATION="" npm run build
      - name: Start svelte node server
        command: |
          cd /app/frontend
          node build/index.js
